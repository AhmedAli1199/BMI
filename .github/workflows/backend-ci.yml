name: backend-ci

# Runs on every PR touching the backend: applies every Alembic migration
# from scratch against a throwaway Postgres, then seeds fake dev data
# through it. This is the automated version of the "test locally before
# staging" step - it exists so a broken migration or a seed-script bug
# (like the FK-order bug this workflow was added right after fixing) is
# caught here, never on staging or production.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  migrate-and-seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bmi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bmi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run every migration up, then down, then up again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Seed and re-seed fake dev data (checks FK ordering, idempotency)
        run: |
          python -m scripts.seed_dev_data
          python -m scripts.seed_dev_data --wipe
